<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>My Dashboard — Jeni's Boutique</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
.dash-layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 65px);margin-top:65px;}
.dash-sidebar{background:var(--wine-deep);padding:2.5rem 2rem;display:flex;flex-direction:column;gap:.4rem;}
.sidebar-title{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.35);font-weight:500;margin:1.2rem 0 .5rem;padding-left:.6rem;}
.sidebar-title:first-child{margin-top:0;}
.sidebar-link{display:flex;align-items:center;gap:.8rem;padding:.7rem .8rem;border-radius:2px;color:rgba(255,255,255,.65);font-size:.88rem;cursor:pointer;transition:all .2s;text-decoration:none;border:none;background:none;width:100%;text-align:left;}
.sidebar-link:hover,.sidebar-link.active{background:rgba(255,255,255,.1);color:#fff;}
.sidebar-link .icon{font-size:1rem;width:18px;text-align:center;}
.dash-main{padding:3rem;overflow-y:auto;background:var(--cream);}
.dash-section{display:none;}
.dash-section.active{display:block;}
.dash-section-title{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;color:var(--charcoal);margin-bottom:2rem;}
.stat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;margin-bottom:2.5rem;}
.stat-card{background:var(--ivory);border:1px solid var(--border);padding:1.5rem;border-radius:2px;}
.stat-card-num{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:700;color:var(--wine);}
.stat-card-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:.2rem;}
.order-card{border:1px solid var(--border);border-radius:2px;padding:1.5rem;background:var(--cream);margin-bottom:1rem;}
.order-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;}
.order-card-id{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:600;color:var(--charcoal);}
.order-card-date{font-size:.78rem;color:var(--muted);margin-top:.2rem;}
.order-card-details{display:flex;gap:1.5rem;flex-wrap:wrap;margin-bottom:1rem;}
.order-card-detail{font-size:.82rem;color:var(--muted);}
.order-card-detail strong{color:var(--charcoal);font-weight:500;}
.order-card-actions{display:flex;gap:.6rem;}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;}
.profile-field{padding:1rem;background:var(--ivory);border:1px solid var(--border);border-radius:2px;}
.profile-field-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500;margin-bottom:.3rem;}
.profile-field-val{font-size:.95rem;font-weight:500;color:var(--charcoal);}
.empty-state{text-align:center;padding:4rem 2rem;background:var(--ivory);border:1px solid var(--border);border-radius:2px;}
.empty-icon{font-size:3rem;margin-bottom:1rem;}
@media(max-width:900px){
  .dash-layout{grid-template-columns:1fr;}
  .dash-sidebar{display:none;}
  .dash-main{padding:2rem;}
  .stat-cards{grid-template-columns:1fr 1fr;}
}
@media(max-width:480px){.stat-cards{grid-template-columns:1fr;}.profile-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<nav id="main-nav"></nav>
<div id="mobile-nav" class="mobile-nav"></div>

<div class="dash-layout">
  <!-- SIDEBAR -->
  <div class="dash-sidebar">
    <div id="user-info" style="padding:.5rem .6rem 1.5rem;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:.5rem;">
      <div style="width:48px;height:48px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:600;color:var(--wine-deep);margin-bottom:.8rem;" id="user-avatar">?</div>
      <div style="font-size:.95rem;font-weight:500;color:#fff;" id="user-name">—</div>
      <div style="font-size:.78rem;color:rgba(255,255,255,.45);" id="user-email">—</div>
    </div>
    <div class="sidebar-title">Dashboard</div>
    <button class="sidebar-link active" onclick="showSection('overview',this)"><span class="icon">🏠</span>Overview</button>
    <button class="sidebar-link" onclick="showSection('orders',this)"><span class="icon">📋</span>My Orders</button>
    <button class="sidebar-link" onclick="showSection('profile',this)"><span class="icon">👤</span>My Profile</button>
    <div class="sidebar-title">Quick Actions</div>
    <a href="order.html" class="sidebar-link"><span class="icon">✦</span>New Order</a>
    <a href="track.html" class="sidebar-link"><span class="icon">📦</span>Track Order</a>
    <a href="occasions.html" class="sidebar-link"><span class="icon">🎂</span>Occasions</a>
    <a href="plans.html" class="sidebar-link"><span class="icon">⭐</span>Upgrade Plan</a>
    <div class="sidebar-title">Account</div>
    <button class="sidebar-link" onclick="Auth.logout()"><span class="icon">↩</span>Logout</button>
  </div>

  <!-- MAIN -->
  <div class="dash-main">
    <!-- OVERVIEW -->
    <div id="sec-overview" class="dash-section active">
      <div class="dash-section-title" id="welcome-msg">Welcome back!</div>
      <div class="stat-cards">
        <div class="stat-card"><div class="stat-card-num" id="stat-total">0</div><div class="stat-card-label">Total Orders</div></div>
        <div class="stat-card"><div class="stat-card-num" id="stat-active">0</div><div class="stat-card-label">Active Orders</div></div>
        <div class="stat-card"><div class="stat-card-num" id="stat-delivered">0</div><div class="stat-card-label">Delivered</div></div>
      </div>
      <h3 style="font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:1.2rem;">Recent Orders</h3>
      <div id="recent-orders"></div>
      <div style="margin-top:2rem;display:flex;gap:1rem;flex-wrap:wrap;">
        <a href="order.html" class="btn btn-primary">Place New Order</a>
        <a href="track.html" class="btn btn-secondary">Track an Order</a>
      </div>
    </div>

    <!-- ALL ORDERS -->
    <div id="sec-orders" class="dash-section">
      <div class="dash-section-title">My Orders</div>
      <div id="all-orders"></div>
    </div>

    <!-- PROFILE -->
    <div id="sec-profile" class="dash-section">
      <div class="dash-section-title">My Profile</div>
      <div class="profile-grid" id="profile-grid"></div>
      <div style="margin-top:2rem;background:var(--info-bg);border:1px solid #B3D1E8;padding:1rem 1.2rem;border-radius:2px;font-size:.85rem;color:var(--info);">
        ℹ️ To update your profile details, please contact us on WhatsApp at <strong>+91 9535629318</strong>.
      </div>
    </div>
  </div>
</div>

<footer id="main-footer"></footer>
<script src="app.js"></script>
<script>
function showSection(id,btn){
  document.querySelectorAll('.dash-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  if(btn)btn.classList.add('active');
}

function buildOrderCard(order,mini=false){
  const addons=order.addOns&&order.addOns.length?order.addOns.join(', '):'None';
  return`<div class="order-card">
    <div class="order-card-header">
      <div>
        <div class="order-card-id">${order.id}</div>
        <div class="order-card-date">Placed: ${fmtDate(order.placedAt)}</div>
      </div>
      ${statusBadge(order.status)}
    </div>
    <div class="order-card-details">
      <div class="order-card-detail"><strong>Occasion</strong><br/>${order.occasion||'—'}</div>
      <div class="order-card-detail"><strong>Garment</strong><br/>${order.garment||'—'}</div>
      <div class="order-card-detail"><strong>Fabric</strong><br/>${order.fabric||'—'}</div>
      <div class="order-card-detail"><strong>Plan</strong><br/>${order.plan||'—'}</div>
      ${!mini?`<div class="order-card-detail"><strong>Add-Ons</strong><br/>${addons}</div>`:''}
      <div class="order-card-detail"><strong>Est. Delivery</strong><br/>${fmtDate(order.estimatedDelivery)}</div>
    </div>
    <div class="order-card-actions">
      <a href="track.html?id=${order.id}" class="btn btn-secondary btn-sm">Track</a>
      <a href="order.html?occasion=${order.occasion||''}&plan=${order.plan||''}" class="btn btn-sm" style="background:var(--ivory);border:1px solid var(--border);">Reorder</a>
    </div>
  </div>`;
}

function initDashboard(){
  const user=Auth.currentUser();
  if(!user){window.location.href='login.html';return;}

  // User info
  document.getElementById('user-avatar').textContent=user.name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('user-name').textContent=user.name;
  document.getElementById('user-email').textContent=user.email;
  document.getElementById('welcome-msg').textContent=`Welcome, ${user.name.split(' ')[0]}!`;

  // Orders
  const orders=user.role==='admin'?Orders.all():Orders.byUser(user.id);
  const active=orders.filter(o=>!['Delivered','Cancelled'].includes(o.status));
  const delivered=orders.filter(o=>o.status==='Delivered');

  document.getElementById('stat-total').textContent=orders.length;
  document.getElementById('stat-active').textContent=active.length;
  document.getElementById('stat-delivered').textContent=delivered.length;

  // Recent orders (last 3)
  const recent=orders.slice(-3).reverse();
  const recentEl=document.getElementById('recent-orders');
  recentEl.innerHTML=recent.length?recent.map(o=>buildOrderCard(o,true)).join(''):
    `<div class="empty-state"><div class="empty-icon">📋</div><p style="color:var(--muted);">No orders yet. <a href="order.html" style="color:var(--wine);">Place your first order!</a></p></div>`;

  // All orders
  const allEl=document.getElementById('all-orders');
  allEl.innerHTML=orders.length?orders.slice().reverse().map(o=>buildOrderCard(o)).join(''):
    `<div class="empty-state"><div class="empty-icon">🧵</div><h3 style="margin-bottom:.5rem;">No orders yet</h3><p style="color:var(--muted);margin-bottom:1.5rem;">Your tailor-made journey starts here.</p><a href="order.html" class="btn btn-primary">Place First Order</a></div>`;

  // Profile
  document.getElementById('profile-grid').innerHTML=`
    <div class="profile-field"><div class="profile-field-label">Full Name</div><div class="profile-field-val">${user.name}</div></div>
    <div class="profile-field"><div class="profile-field-label">Email</div><div class="profile-field-val">${user.email}</div></div>
    <div class="profile-field"><div class="profile-field-label">Phone</div><div class="profile-field-val">${user.phone||'Not set'}</div></div>
    <div class="profile-field"><div class="profile-field-label">Account Type</div><div class="profile-field-val">${user.role==='admin'?'Administrator':'Customer'}</div></div>
    <div class="profile-field"><div class="profile-field-label">Member Since</div><div class="profile-field-val">${user.joinedAt?fmtDate(user.joinedAt):'—'}</div></div>
    <div class="profile-field"><div class="profile-field-label">Total Orders</div><div class="profile-field-val">${orders.length}</div></div>`;
}

document.addEventListener('DOMContentLoaded',()=>{
  renderNav('dashboard.html');
  renderFooter();
  initDashboard();
});
</script>
</body>
</html>
