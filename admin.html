<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Panel — Jeni's Boutique</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
.admin-layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 65px);margin-top:65px;}
.admin-sidebar{background:var(--charcoal);padding:2rem 1.5rem;display:flex;flex-direction:column;gap:.3rem;}
.sidebar-title{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.3);font-weight:500;margin:1rem 0 .4rem;padding-left:.6rem;}
.sidebar-link{display:flex;align-items:center;gap:.7rem;padding:.65rem .8rem;border-radius:2px;color:rgba(255,255,255,.6);font-size:.85rem;cursor:pointer;transition:all .2s;text-decoration:none;border:none;background:none;width:100%;text-align:left;}
.sidebar-link:hover,.sidebar-link.active{background:rgba(255,255,255,.08);color:#fff;}
.admin-main{padding:2.5rem 3rem;background:var(--cream);overflow-y:auto;}
.admin-section{display:none;}
.admin-section.active{display:block;}
.admin-title{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:var(--charcoal);margin-bottom:2rem;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2.5rem;}
.kpi{background:var(--ivory);border:1px solid var(--border);padding:1.2rem 1.5rem;border-radius:2px;}
.kpi-num{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--wine);}
.kpi-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:.2rem;}
.filters{display:flex;gap:.8rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center;}
.filter-select{padding:.5rem .9rem;border:1.5px solid var(--border);background:var(--cream);border-radius:2px;font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--charcoal);outline:none;cursor:pointer;}
.filter-select:focus{border-color:var(--wine);}
.filter-input{padding:.5rem .9rem;border:1.5px solid var(--border);background:var(--cream);border-radius:2px;font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--charcoal);outline:none;min-width:220px;}
.filter-input:focus{border-color:var(--wine);}
.orders-table .order-row{border:1px solid var(--border);border-radius:2px;padding:1.2rem 1.5rem;margin-bottom:.6rem;background:var(--cream);display:grid;grid-template-columns:130px 1fr 1fr 1fr 140px 160px;gap:1rem;align-items:center;}
.orders-table .order-row:hover{background:var(--ivory);}
.order-id{font-weight:600;font-size:.9rem;color:var(--wine);}
.order-cust{font-size:.85rem;font-weight:500;}
.order-meta{font-size:.78rem;color:var(--muted);}
.order-date{font-size:.78rem;color:var(--muted);}
.status-select{padding:.35rem .6rem;border:1.5px solid var(--border);background:var(--cream);border-radius:2px;font-family:'DM Sans',sans-serif;font-size:.78rem;color:var(--charcoal);outline:none;width:100%;cursor:pointer;}
.status-select:focus{border-color:var(--wine);}
.row-actions{display:flex;gap:.4rem;}
.thead{display:grid;grid-template-columns:130px 1fr 1fr 1fr 140px 160px;gap:1rem;padding:.6rem 1.5rem;margin-bottom:.5rem;}
.thead span{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500;}
.detail-modal{display:none;position:fixed;inset:0;background:rgba(44,36,32,.55);z-index:500;align-items:center;justify-content:center;overflow-y:auto;padding:2rem;}
.detail-modal.open{display:flex;}
.detail-box{background:var(--cream);border-radius:2px;padding:2.5rem;max-width:640px;width:100%;position:relative;max-height:90vh;overflow-y:auto;}
.detail-close{position:absolute;top:1rem;right:1rem;background:none;border:none;cursor:pointer;font-size:1.3rem;color:var(--muted);}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:1.5rem 0;}
.detail-field{padding:.8rem 1rem;background:var(--ivory);border-radius:2px;}
.detail-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500;margin-bottom:.2rem;}
.detail-val{font-size:.88rem;font-weight:500;color:var(--charcoal);}
.users-list{display:flex;flex-direction:column;gap:.6rem;}
.user-row{border:1px solid var(--border);border-radius:2px;padding:1rem 1.5rem;background:var(--cream);display:flex;align-items:center;gap:1.5rem;}
.user-avatar{width:38px;height:38px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:600;color:var(--wine-deep);flex-shrink:0;}
.user-info{flex:1;}
.user-name{font-size:.9rem;font-weight:500;color:var(--charcoal);}
.user-meta{font-size:.78rem;color:var(--muted);}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:900px){.admin-layout{grid-template-columns:1fr;}.admin-sidebar{display:none;}.admin-main{padding:2rem;}.orders-table .order-row,.thead{grid-template-columns:1fr 1fr;}.thead span:nth-child(n+3){display:none;}.order-row>*:nth-child(n+3):nth-child(-n+4){display:none;}}
</style>
</head>
<body>
<nav id="main-nav"></nav>
<div id="mobile-nav" class="mobile-nav"></div>

<div class="admin-layout">
  <!-- SIDEBAR -->
  <div class="admin-sidebar">
    <div style="padding:.5rem .6rem 1.5rem;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:.5rem;">
      <div style="font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:.3rem;">Admin Panel</div>
      <div style="font-size:1rem;font-weight:500;color:#fff;">Jeni's Boutique</div>
    </div>
    <div class="sidebar-title">Management</div>
    <button class="sidebar-link active" onclick="showSection('orders',this)">📋 All Orders</button>
    <button class="sidebar-link" onclick="showSection('users',this)">👥 Customers</button>
    <button class="sidebar-link" onclick="showSection('analytics',this)">📊 Analytics</button>
    <div class="sidebar-title">Quick</div>
    <a href="index.html" class="sidebar-link">🏠 View Site</a>
    <a href="dashboard.html" class="sidebar-link">📦 My Dashboard</a>
    <button class="sidebar-link" onclick="Auth.logout()">↩ Logout</button>
  </div>

  <!-- MAIN -->
  <div class="admin-main">
    <!-- ORDERS SECTION -->
    <div id="sec-orders" class="admin-section active">
      <div class="admin-title">Order Management</div>
      <div class="kpi-grid" id="kpi-grid"></div>
      <div class="filters">
        <input class="filter-input" id="search-input" placeholder="🔍  Search by Order ID, name, phone…" oninput="renderOrders()"/>
        <select class="filter-select" id="status-filter" onchange="renderOrders()">
          <option value="">All Statuses</option>
          <option>Received</option><option>Cutting</option><option>Stitching</option>
          <option>Quality Check</option><option>Ready</option><option>Out for Delivery</option>
          <option>Delivered</option><option>Cancelled</option>
        </select>
        <select class="filter-select" id="plan-filter" onchange="renderOrders()">
          <option value="">All Plans</option>
          <option>Basic</option><option>Plus</option>
        </select>
        <button class="btn btn-sm btn-secondary" onclick="exportCSV()">⬇ Export CSV</button>
      </div>
      <div class="thead">
        <span>Order ID</span><span>Customer</span><span>Occasion</span><span>Details</span><span>Status</span><span>Actions</span>
      </div>
      <div class="orders-table" id="orders-table"></div>
    </div>

    <!-- USERS SECTION -->
    <div id="sec-users" class="admin-section">
      <div class="admin-title">Customers</div>
      <div class="users-list" id="users-list"></div>
    </div>

    <!-- ANALYTICS SECTION -->
    <div id="sec-analytics" class="admin-section">
      <div class="admin-title">Analytics</div>
      <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);" id="analytics-kpis"></div>
      <div style="margin-top:2rem;">
        <h3 style="font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:1.2rem;">Orders by Occasion</h3>
        <div id="occ-chart"></div>
      </div>
      <div style="margin-top:2.5rem;">
        <h3 style="font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:1.2rem;">Orders by Status</h3>
        <div id="status-chart"></div>
      </div>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="detail-modal" id="detail-modal">
  <div class="detail-box">
    <button class="detail-close" onclick="closeModal()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<footer id="main-footer"></footer>
<script src="app.js"></script>
<script>
const STATUS_OPTIONS=['Received','Cutting','Stitching','Quality Check','Ready','Out for Delivery','Delivered','Cancelled'];

function showSection(id,btn){
  document.querySelectorAll('.admin-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  if(btn)btn.classList.add('active');
  if(id==='users')renderUsers();
  if(id==='analytics')renderAnalytics();
}

function renderKPIs(){
  const orders=Orders.all();
  const active=orders.filter(o=>!['Delivered','Cancelled'].includes(o.status));
  const delivered=orders.filter(o=>o.status==='Delivered');
  const revenue=orders.reduce((s,o)=>s+(o.cost||0),0);
  document.getElementById('kpi-grid').innerHTML=`
    <div class="kpi"><div class="kpi-num">${orders.length}</div><div class="kpi-label">Total Orders</div></div>
    <div class="kpi"><div class="kpi-num">${active.length}</div><div class="kpi-label">Active Orders</div></div>
    <div class="kpi"><div class="kpi-num">${delivered.length}</div><div class="kpi-label">Delivered</div></div>
    <div class="kpi"><div class="kpi-num">₹${revenue.toLocaleString('en-IN')}</div><div class="kpi-label">Total Revenue</div></div>`;
}

function renderOrders(){
  const orders=Orders.all();
  const search=(document.getElementById('search-input').value||'').toLowerCase();
  const statusF=document.getElementById('status-filter').value;
  const planF=document.getElementById('plan-filter').value;
  let filtered=orders.filter(o=>{
    const match=!search||(o.id.toLowerCase().includes(search)||
      (o.userName||'').toLowerCase().includes(search)||(o.userPhone||'').includes(search));
    const st=!statusF||o.status===statusF;
    const pl=!planF||o.plan===planF;
    return match&&st&&pl;
  }).reverse();
  const el=document.getElementById('orders-table');
  if(!filtered.length){el.innerHTML=`<div class="empty-state" style="margin-top:1rem;"><div class="empty-icon">📋</div><p style="color:var(--muted);">No orders match your filters.</p></div>`;return;}
  el.innerHTML=filtered.map(o=>`
    <div class="order-row">
      <div><div class="order-id">${o.id}</div><div class="order-date">${fmtDate(o.placedAt)}</div></div>
      <div><div class="order-cust">${o.userName||o.name||'—'}</div><div class="order-meta">${o.userPhone||'—'}</div></div>
      <div><div class="order-meta">${o.occasion||'—'}</div><div class="order-meta">${o.plan||'—'} Plan</div></div>
      <div><div class="order-meta">${o.garment||'—'}</div><div class="order-meta">${o.fabric||'—'}</div></div>
      <div>
        <select class="status-select" onchange="updateStatus('${o.id}',this.value)">
          ${STATUS_OPTIONS.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="row-actions">
        <button class="btn btn-sm btn-secondary" onclick="viewDetail('${o.id}')">View</button>
        <button class="btn btn-sm btn-danger" onclick="cancelOrder('${o.id}')">Cancel</button>
      </div>
    </div>`).join('');
}

function updateStatus(id,status){
  Orders.updateStatus(id,status,'Status updated by admin.');
  renderKPIs();
  showToast('Order '+id+' → '+status,'success');
}

function cancelOrder(id){
  if(!confirm('Cancel order '+id+'? This cannot be undone.'))return;
  Orders.updateStatus(id,'Cancelled','Cancelled by admin.');
  renderOrders();renderKPIs();
  showToast('Order '+id+' cancelled.','error');
}

function viewDetail(id){
  const o=Orders.byId(id);
  if(!o)return;
  const addons=o.addOns&&o.addOns.length?o.addOns.join(', '):'None';
  const meas=o.measurements?Object.entries(o.measurements).filter(([k,v])=>v).map(([k,v])=>`${k}: ${v}"`).join(', '):'Not provided';
  document.getElementById('modal-content').innerHTML=`
    <div style="font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;margin-bottom:.3rem;">${o.id}</div>
    <div style="margin-bottom:1.5rem;">${statusBadge(o.status)}</div>
    <div class="detail-grid">
      <div class="detail-field"><div class="detail-label">Customer</div><div class="detail-val">${o.userName||o.name||'—'}</div></div>
      <div class="detail-field"><div class="detail-label">Phone</div><div class="detail-val">${o.userPhone||o.phone||'—'}</div></div>
      <div class="detail-field"><div class="detail-label">Email</div><div class="detail-val">${o.userEmail||o.email||'—'}</div></div>
      <div class="detail-field"><div class="detail-label">Plan</div><div class="detail-val">${o.plan||'—'}</div></div>
      <div class="detail-field"><div class="detail-label">Occasion</div><div class="detail-val">${o.occasion||'—'}</div></div>
      <div class="detail-field"><div class="detail-label">Garment</div><div class="detail-val">${o.garment||'—'}</div></div>
      <div class="detail-field"><div class="detail-label">Fabric</div><div class="detail-val">${o.fabric||'—'}</div></div>
      <div class="detail-field"><div class="detail-label">Colour</div><div class="detail-val">${o.colour||'—'}</div></div>
      <div class="detail-field"><div class="detail-label">Qty</div><div class="detail-val">${o.qty||1}</div></div>
      <div class="detail-field"><div class="detail-label">Cost</div><div class="detail-val" style="color:var(--wine);font-weight:600;">₹${(o.cost||0).toLocaleString('en-IN')}</div></div>
      <div class="detail-field"><div class="detail-label">Delivery</div><div class="detail-val">${o.delivery||'—'}</div></div>
      <div class="detail-field"><div class="detail-label">Est. Delivery</div><div class="detail-val">${fmtDate(o.estimatedDelivery)}</div></div>
    </div>
    <div class="detail-field" style="margin-bottom:.8rem;"><div class="detail-label">Add-Ons</div><div class="detail-val">${addons}</div></div>
    <div class="detail-field" style="margin-bottom:.8rem;"><div class="detail-label">Measurements</div><div class="detail-val">${meas}</div></div>
    ${o.address?`<div class="detail-field" style="margin-bottom:.8rem;"><div class="detail-label">Delivery Address</div><div class="detail-val">${o.address}</div></div>`:''}
    ${o.notes?`<div class="detail-field"><div class="detail-label">Notes</div><div class="detail-val">${o.notes}</div></div>`:''}
    <div style="margin-top:1.5rem;">
      <div style="font-size:.78rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.8rem;">Update Status</div>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;">
        ${STATUS_OPTIONS.map(s=>`<button class="btn btn-sm ${s===o.status?'btn-primary':'btn-secondary'}" onclick="updateStatus('${o.id}','${s}');closeModal();renderOrders();">${s}</button>`).join('')}
      </div>
    </div>`;
  document.getElementById('detail-modal').classList.add('open');
}

function closeModal(){document.getElementById('detail-modal').classList.remove('open');}

function renderUsers(){
  const users=DB.get('jeni_users')||[];
  const orders=Orders.all();
  const el=document.getElementById('users-list');
  if(!users.length){el.innerHTML=`<div class="empty-state"><div class="empty-icon">👥</div><p style="color:var(--muted);">No registered customers yet.</p></div>`;return;}
  el.innerHTML=users.map(u=>{
    const uOrders=orders.filter(o=>o.userId===u.id);
    return`<div class="user-row">
      <div class="user-avatar">${u.name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase()}</div>
      <div class="user-info">
        <div class="user-name">${u.name}</div>
        <div class="user-meta">${u.email} · ${u.phone||'No phone'}</div>
      </div>
      <div><span class="badge badge-wine">${uOrders.length} order${uOrders.length!==1?'s':''}</span></div>
      <div style="font-size:.78rem;color:var(--muted);">Joined ${u.joinedAt?fmtDate(u.joinedAt):'—'}</div>
    </div>`;
  }).join('');
}

function renderAnalytics(){
  const orders=Orders.all();
  const revenue=orders.reduce((s,o)=>s+(o.cost||0),0);
  const avg=orders.length?Math.round(revenue/orders.length):0;
  const plusPct=orders.length?Math.round(orders.filter(o=>o.plan==='Plus').length/orders.length*100):0;
  document.getElementById('analytics-kpis').innerHTML=`
    <div class="kpi"><div class="kpi-num">₹${revenue.toLocaleString('en-IN')}</div><div class="kpi-label">Total Revenue</div></div>
    <div class="kpi"><div class="kpi-num">₹${avg.toLocaleString('en-IN')}</div><div class="kpi-label">Avg Order Value</div></div>
    <div class="kpi"><div class="kpi-num">${plusPct}%</div><div class="kpi-label">Plus Plan Share</div></div>`;
  // Occasion breakdown
  const occMap={};
  orders.forEach(o=>{occMap[o.occasion]=(occMap[o.occasion]||0)+1;});
  const maxOcc=Math.max(...Object.values(occMap),1);
  document.getElementById('occ-chart').innerHTML=Object.entries(occMap).map(([occ,cnt])=>`
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:.8rem;">
      <div style="width:120px;font-size:.85rem;color:var(--charcoal);">${occ||'Other'}</div>
      <div style="flex:1;background:var(--border);border-radius:2px;height:24px;overflow:hidden;">
        <div style="width:${Math.round(cnt/maxOcc*100)}%;background:var(--wine);height:100%;border-radius:2px;"></div>
      </div>
      <div style="width:30px;font-size:.85rem;text-align:right;color:var(--charcoal);">${cnt}</div>
    </div>`).join('');
  // Status breakdown
  const stMap={};
  orders.forEach(o=>{stMap[o.status]=(stMap[o.status]||0)+1;});
  const maxSt=Math.max(...Object.values(stMap),1);
  document.getElementById('status-chart').innerHTML=Object.entries(stMap).map(([st,cnt])=>`
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:.8rem;">
      <div style="width:120px;">${statusBadge(st)}</div>
      <div style="flex:1;background:var(--border);border-radius:2px;height:24px;overflow:hidden;">
        <div style="width:${Math.round(cnt/maxSt*100)}%;background:var(--gold);height:100%;border-radius:2px;"></div>
      </div>
      <div style="width:30px;font-size:.85rem;text-align:right;color:var(--charcoal);">${cnt}</div>
    </div>`).join('');
}

function exportCSV(){
  const orders=Orders.all();
  const headers=['ID','Customer','Phone','Email','Occasion','Garment','Fabric','Plan','Status','Cost','Placed','Est Delivery'];
  const rows=orders.map(o=>[
    o.id,o.userName||o.name,o.userPhone||o.phone,o.userEmail||o.email,
    o.occasion,o.garment,o.fabric,o.plan,o.status,o.cost||0,
    fmtDate(o.placedAt),fmtDate(o.estimatedDelivery)
  ]);
  const csv=[headers,...rows].map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='jeni-orders.csv';a.click();
  showToast('CSV exported!','success');
}

document.addEventListener('DOMContentLoaded',()=>{
  if(!Auth.isAdmin()){window.location.href='login.html';return;}
  renderNav('admin.html');
  renderFooter();
  renderKPIs();
  renderOrders();
  document.getElementById('detail-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
});
</script>
</body>
</html>
